version: '3.8'

services:
  postgres:
    image: postgres:15-alpine
    container_name: school_postgres
    environment:
      POSTGRES_DB: school_db
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: secret
    volumes:
      - pgdata:/var/lib/postgresql/data
    restart: unless-stopped

  bot:
    build: .
    container_name: school_bot
    depends_on:
      - postgres
    environment:
      - DB_HOST=postgres
      - DB_NAME=school_db
      - DB_USER=postgres
      - DB_PASSWORD=secret
      - BOT_USERNAME=ИМЯ_ТВОЕГО_БОТА
      - BOT_TOKEN=ТОКЕН_ОТ_BOTFATHER
      - SPREADSHEET_ID=ID_ТВОЕЙ_GOOGLE_ТАБЛИЦЫ
    volumes:
      # Пробрасываем файл ключей Google снаружи на сервер
      - ./google-credentials.json:/app/google-credentials.json
    restart: unless-stopped

volumes:
  pgdata: