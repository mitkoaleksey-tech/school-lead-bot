bot:
  build: .
  container_name: school_bot
  depends_on:
    - postgres
  environment:
    - DB_HOST=postgres
    - DB_NAME=school_db
    - DB_USER=postgres
    - DB_PASSWORD=secret
    - BOT_USERNAME=${BOT_USERNAME}
    - BOT_TOKEN=${BOT_TOKEN}
    - SPREADSHEET_ID=${SPREADSHEET_ID}
  volumes:
    - ./google-credentials.json:/app/google-credentials.json
  restart: unless-stopped