spring:
  datasource:
    url: jdbc:postgresql://${DB_HOST:postgres}:${DB_PORT:5432}/${DB_NAME:school_db}
    username: ${DB_USER:postgres}
    password: ${DB_PASSWORD:secret}
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect

bot:
  username: "${BOT_USERNAME}"
  token: "${BOT_TOKEN}"
  subjects:
    - "🐍 Python"
    - "💻 Информатика"
    - "⚛️ Физика"
    - "📐 Математика"

google:
  spreadsheet:
    id: "${SPREADSHEET_ID}"